name: Container hardening audit

on:
  schedule:
    - cron: "57 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Pulls the pinned image from ghcr.io.
      packages: read
      # Uploads the Trivy SARIF scan to code scanning.
      security-events: write
      # Creates, edits, and closes the "Container hardening report" issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and pull pinned image
        run: |
          set -euo pipefail
          # Same structural validation locked-image-check applies: resolve
          # the ux_tools entry explicitly rather than trusting key order.
          ref=$(python3 - <<'PY'
          import json
          import re
          import sys

          data = json.load(open("docker/image-digests.json", encoding="utf-8"))
          if not isinstance(data, dict):
              sys.exit("image digest lock must be a JSON object")
          entry = data.get("ux_tools")
          if not isinstance(entry, dict):
              sys.exit("missing ux_tools digest lock entry")
          image = entry.get("image")
          digest = entry.get("digest")
          if image != "ghcr.io/vibebb/ux-tools":
              sys.exit(f"unexpected ux_tools image: {image}")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              sys.exit(f"invalid ux_tools digest: {digest}")
          print(f"{image}@{digest}")
          PY
          )
          echo "PINNED_IMAGE=$ref" >> "$GITHUB_ENV"
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          retry docker pull "$ref"
      - id: week
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # trivy-action's built-in cache is daily-keyed, so a weekly audit
      # misses it after every midnight; a weekly key reuses the ~1 GB DB
      # across successive runs. It feeds only the JSON scan leg below —
      # the legs run concurrently, so each gets its own cache dir.
      - name: Restore Trivy DB cache (weekly)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-week-${{ steps.week.outputs.iso }}
          restore-keys: cache-trivy-week-
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Warm the Trivy DB for the raw-trivy scan legs
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        # Populate the shared seed dir serially; each leg copies it into a
        # private cache dir first and only ever writes there. Concurrent
        # trivy processes in one cache dir race on db/metadata.json and
        # corrupt it.
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          if [ -d .cache/trivy ]; then
            cp -a .cache/trivy/. "$TRIVY_CACHE_DIR/"
          fi
          trivy image --download-db-only
      # The scans read the same pinned image, each writes a disjoint
      # report path, and each trivy process writes to its own cache dir,
      # so they run as one parallel group (implicit wait at the end).
      # One scan feeds both outputs: the full JSON is the audit artifact,
      # and the SARIF below is `trivy convert`ed from a filtered view of it
      # — identical to the old second scan's severity/ignore-unfixed
      # filter, but without re-scanning the same digest.
      - parallel:
          - name: Scan pinned image (Trivy JSON, full)
            env:
              TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-json
            # The digest is frozen; the vulnerability DB is not — this scan
            # surfaces newly disclosed CVEs against the shipped tools image.
            run: |
              set -euo pipefail
              mkdir -p "$TRIVY_CACHE_DIR"
              cp -a "$RUNNER_TEMP/trivy-cache/." "$TRIVY_CACHE_DIR/"
              trivy image --scanners vuln,secret,misconfig,license \
                --format json --output trivy-image.json "$PINNED_IMAGE"
          - name: Run Docker CIS compliance report
            env:
              # Private dir seeded from the warmed copy: concurrent use of
              # one cache dir raced on db/metadata.json once already.
              TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-cis
            run: |
              set -euo pipefail
              mkdir -p "$TRIVY_CACHE_DIR"
              cp -a "$RUNNER_TEMP/trivy-cache/." "$TRIVY_CACHE_DIR/"
              # The compliance scan occasionally returns exit 0 with an empty
              # MisconfSummary payload (the dead-metric anomaly): key the one
              # retry on the payload content, not the exit code.
              for attempt in 1 2; do
                trivy image --compliance docker-cis-1.6.0 --include-non-failures --report all \
                  --ignorefile /dev/null --format json \
                  --output "$RUNNER_TEMP/trivy-cis.json" "${PINNED_IMAGE}"
                if python3 - "$RUNNER_TEMP/trivy-cis.json" <<'PY'
              import json
              import sys

              data = json.load(open(sys.argv[1], encoding="utf-8"))

              def _summaries(node):
                  yield node
                  for child in node.get("Results") or []:
                      yield from _summaries(child)

              total = sum(
                  int((result.get("MisconfSummary") or {}).get(key, 0))
                  for result in _summaries(data)
                  for key in ("Successes", "Failures")
              )
              sys.exit(0 if total else 1)
              PY
                then
                  break
                fi
                if [ "$attempt" = 2 ]; then
                  echo "::error::CIS scan returned an empty MisconfSummary payload twice" >&2
                  exit 1
                fi
                echo "::warning::CIS scan returned an empty MisconfSummary payload; retrying" >&2
              done
          - name: Run informational Lynis audit inside the image
            id: lynis
            continue-on-error: true
            env:
              LYNIS_OUT: ${{ runner.temp }}/lynis-out
            run: |
              set -uo pipefail
              # Pin the 3.1.7 release commit, not the mutable tag.
              git clone --depth 1 --branch 3.1.7 \
                https://github.com/CISOfy/lynis "$RUNNER_TEMP/lynis"
              git -C "$RUNNER_TEMP/lynis" rev-parse HEAD \
                | grep -qx 2e99f92265760b73fd6b139868eb8d4116624030
              # tests/test_workflow_paths.py requires every workflow
              # `docker run --user` to be the image's `ux` user — Lynis runs
              # unprivileged here, which is acceptable for a trend-only audit.
              mkdir -p "$LYNIS_OUT"
              chmod 777 "$LYNIS_OUT"
              docker run --rm --user ux \
                -v "$RUNNER_TEMP/lynis:/lynis:ro" \
                -v "$GITHUB_WORKSPACE/docker/lynis-container.prf:/container.prf:ro" \
                -v "$LYNIS_OUT:/out" \
                --entrypoint /bin/sh "$PINNED_IMAGE" \
                -c 'cd /lynis && ./lynis audit system --quick --no-colors \
                    --profile /container.prf \
                    --report-file /out/lynis-report.dat --logfile /out/lynis.log \
                    --auditor github-actions </dev/null \
                    2>&1 | grep -v -E "Press ENTER to continue|NON-PRIVILEGED SCAN MODE|Security check failed"; \
                    # Lynis writes its outputs with umask 027 (0640 ux-owned):
                    # loosen them so the runner-side grep below can read them.
                    chmod 644 /out/lynis-report.dat /out/lynis.log 2>/dev/null' || true
              index=$(grep '^hardening_index=' "$LYNIS_OUT/lynis-report.dat" \
                | head -1 | cut -d= -f2 || true)
              warnings=$(grep -c '^warning\[\]' "$LYNIS_OUT/lynis-report.dat" || true)
              printf 'hardening_index=%s\nwarnings=%s\n' \
                "${index:-unknown}" "${warnings:-0}" >> "$GITHUB_OUTPUT"
      - name: Filter findings and convert SARIF
        run: |
          set -euo pipefail
          python3 scripts/trivy_findings.py \
            --input trivy-image.json \
            --filtered trivy-image.filtered.json \
            --summary "$GITHUB_STEP_SUMMARY"
          trivy convert --format sarif \
            --output trivy-image.sarif trivy-image.filtered.json
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-ux-tools-audit
      - name: Compute container-hardening report
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
          TRIVY_JSON: trivy-image.json
          TRIVY_CIS: ${{ runner.temp }}/trivy-cis.json
          REPORT_JSON: container-hardening.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from collections import Counter
          trivy = json.load(open(os.environ["TRIVY_JSON"], encoding="utf-8"))
          vulns, secrets, licenses = Counter(), Counter(), 0
          mis_pass = mis_total = 0
          fixable_high = 0
          for result in trivy.get("Results", []):
              for v in result.get("Vulnerabilities") or []:
                  sev = v.get("Severity", "UNKNOWN").lower()
                  fixed = bool(v.get("FixedVersion"))
                  vulns[sev] += 1
                  if fixed:
                      vulns[f"{sev}_fixed"] += 1
                      if sev in ("critical", "high"):
                          fixable_high += 1
              mis = result.get("Misconfigurations") or []
              for m in mis:
                  mis_total += 1
                  if m.get("Status") == "PASS":
                      mis_pass += 1
              for s in result.get("Secrets") or []:
                  secrets[s.get("Severity", "UNKNOWN").lower()] += 1
              for lic in result.get("Licenses") or []:
                  licenses += 1
          def _summaries(node):
              yield node
              for child in node.get("Results") or []:
                  yield from _summaries(child)
          # trivy --compliance nests each control's check summaries inside
          # control Results; read MisconfSummary at every depth.
          cis = {"passed": 0, "failed": 0}
          cis_data = json.load(open(os.environ["TRIVY_CIS"], encoding="utf-8"))
          for result in _summaries(cis_data):
              summary = result.get("MisconfSummary") or {}
              cis["passed"] += int(summary.get("Successes", 0))
              cis["failed"] += int(summary.get("Failures", 0))
          if cis["passed"] + cis["failed"] == 0:
              # dead telemetry must fail, not masquerade as coverage
              sys.exit("Docker CIS scan produced no results")
          lynis = {"hardening_index": "unknown", "warnings": 0}
          try:
              for line in open(os.environ["LYNIS_OUT"] + "/lynis-report.dat",
                               encoding="utf-8", errors="replace"):
                  if line.startswith("hardening_index="):
                      lynis["hardening_index"] = line.split("=", 1)[1].strip()
                  elif line.startswith("warning[]"):
                      lynis["warnings"] += 1
          except OSError:
              pass
          image, _, digest = os.environ["PINNED_IMAGE"].partition("@")
          report = {
              "image": image,
              "digest": digest,
              "trivy": {
                  "critical": vulns["critical"],
                  "high": vulns["high"],
                  "medium": vulns["medium"],
                  "low": vulns["low"],
                  "fixable_high_or_critical": fixable_high,
                  "misconfig_pass": mis_pass,
                  "misconfig_total": mis_total,
                  "secrets": sum(secrets.values()),
                  "license_findings": licenses,
              },
              "cis_docker": cis,
              "lynis": lynis,
              "gate": {"fixable_high_or_critical": fixable_high},
          }
          with open(os.environ["REPORT_JSON"], "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Collect audit artifacts
        if: always()
        run: |
          set -euo pipefail
          # The scan inputs live in $RUNNER_TEMP — gather them so the run
          # retains the exact payloads the recursive walk consumed.
          mkdir -p audit-artifacts
          cp "${{ runner.temp }}/trivy-cis.json" audit-artifacts/ 2>/dev/null || true
          cp trivy-image.filtered.json audit-artifacts/ 2>/dev/null || true
          cp -r "${{ runner.temp }}/lynis-out" audit-artifacts/lynis 2>/dev/null || true
      - name: Upload hardening report
        if: always() && hashFiles('container-hardening.json', 'trivy-image.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux-tools-audit
          path: |
            container-hardening.json
            trivy-image.json
            audit-artifacts/
          retention-days: 90
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_JSON: container-hardening.json
          REPORT_MD: ${{ runner.temp }}/hardening-report.md
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$REPORT_MD"
          import json, os
          r = json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))
          t = r["trivy"]
          print(f"# Container hardening report\n")
          print(f"Image: `{r['image']}`\nDigest: `{r['digest']}`\n")
          print("| Metric | Value |")
          print("|---|---|")
          print(f"| Trivy vulns C/H/M/L | {t['critical']}/{t['high']}/{t['medium']}/{t['low']} |")
          print(f"| Fixable HIGH+CRITICAL | {t['fixable_high_or_critical']} |")
          print(f"| Misconfig pass | {t['misconfig_pass']}/{t['misconfig_total']} |")
          print(f"| Secrets found | {t['secrets']} |")
          print(f"| CIS Docker pass/fail | {r['cis_docker']['passed']}/{r['cis_docker']['failed']} |")
          print(f"| Lynis hardening index (trend only) | {r['lynis']['hardening_index']} |")
          print(f"| Lynis warnings | {r['lynis']['warnings']} |")
          print(f"\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          PY
          # gh issue create fails with "could not add label" when the label
          # does not exist (observed before the first report issue landed).
          gh label create container-hardening --repo "$GITHUB_REPOSITORY" \
            --color d93f0b --description "Container hardening report" --force
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label container-hardening \
            --search "in:title Container hardening report" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_MD"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Container hardening report" \
              --label container-hardening --body-file "$REPORT_MD" | sed 's#.*/##')
          fi
          gate=$(python3 -c 'import json, os; print(json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))["gate"]["fixable_high_or_critical"])')
          if [ "$gate" = "0" ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "No fixable HIGH/CRITICAL findings remain."
          fi
