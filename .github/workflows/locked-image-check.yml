name: Locked image check

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: locked-image-check
  cancel-in-progress: false

jobs:
  check-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    permissions:
      contents: read
    outputs:
      present: ${{ steps.lock.outputs.present }}
      image: ${{ steps.lock.outputs.image }}
      digest: ${{ steps.lock.outputs.digest }}
      attestation: ${{ steps.lock.outputs.attestation }}
      sbom_attestation: ${{ steps.sbom.outputs.sbom_attestation }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: |
          if [ ! -s docker/image-digests.json ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          lock_path = Path("docker/image-digests.json")
          try:
              data = json.loads(lock_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"invalid image digest lock: {exc}") from exc
          if not isinstance(data, dict):
              raise SystemExit("image digest lock must be a JSON object")
          entry = data.get("ux_tools")
          if not isinstance(entry, dict) or entry.get("image") != "ghcr.io/vibebb/ux-tools":
              raise SystemExit("invalid ux_tools digest lock entry")
          if "digest" not in entry or "tag" not in entry:
              raise SystemExit("ux_tools lock must contain digest and tag fields")
          digest = entry.get("digest")
          tag = entry.get("tag")
          if digest is None and tag is None:
              if entry.get("attestation") is not None:
                  raise SystemExit("ux_tools attestation cannot exist without a pinned image")
              print("present=false")
              print("image=")
              print("digest=")
              print("attestation=")
          else:
              if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
                  raise SystemExit("ux_tools digest must be null or a sha256 digest")
              if not isinstance(tag, str) or re.fullmatch(r"[0-9a-f]{40}-tools", tag) is None:
                  raise SystemExit("ux_tools tag must be null or a 40-character tools tag")
              attestation = entry.get("attestation")
              if attestation is None:
                  attestation = ""
              elif not isinstance(attestation, str) or not attestation.startswith("https://"):
                  raise SystemExit("ux_tools attestation must be an HTTPS URL")
              print("present=true")
              print(f"image={entry['image']}")
              print(f"digest={digest}")
              print(f"attestation={attestation}")
          PY
      - id: sbom
        env:
          LOCK_PATH: docker/image-digests.json
          LOCK_ENTRY: ux_tools
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path(os.environ["LOCK_PATH"])
          entry = None
          if path.is_file():
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("image digest lock must be a JSON object")
              entry = data.get(os.environ["LOCK_ENTRY"])
          if entry is not None and not isinstance(entry, dict):
              raise SystemExit("image lock entry must be an object")
          sbom_attestation = entry.get("sbom_attestation") if entry else None
          if entry and entry.get("digest") is None and entry.get("tag") is None:
              if sbom_attestation is not None:
                  raise SystemExit("unpublished image entry cannot have an SBOM attestation")
              sbom_attestation = ""
          elif sbom_attestation is not None:
              parsed = urlsplit(sbom_attestation) if isinstance(sbom_attestation, str) else None
              if (
                  parsed is None
                  or parsed.scheme != "https"
                  or not parsed.netloc
                  or any(character.isspace() for character in sbom_attestation)
              ):
                  raise SystemExit("image lock SBOM attestation must be an HTTPS URL")
          print(f"sbom_attestation={sbom_attestation or ''}")
          PY
  check:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: locked-image-check
      - run: uv sync --locked
      # The image pull and the attestation verifications only need the
      # lock contents — not each other — so they run as one parallel
      # group; the pulled image is guaranteed present by the implicit
      # wait before the smoke below.
      - parallel:
          - name: Pull locked image
            run: uv run python scripts/pull_locked_image.py --entry ux_tools
          - name: Verify published image provenance
            if: needs.check-lock.outputs.attestation != ''
            env:
              GH_TOKEN: ${{ github.token }}
              IMAGE: ${{ needs.check-lock.outputs.image }}
              DIGEST: ${{ needs.check-lock.outputs.digest }}
            run: |
              gh attestation verify "oci://${IMAGE}@${DIGEST}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-ux-images.yml"
          - name: Warn when image SBOM attestation is absent
            if: needs.check-lock.outputs.sbom_attestation == ''
            run: echo "::warning::ux_tools image lock has no recorded SBOM attestation"
          - name: Verify published image SBOM attestation
            if: needs.check-lock.outputs.sbom_attestation != ''
            env:
              GH_TOKEN: ${{ github.token }}
              IMAGE: ${{ needs.check-lock.outputs.image }}
              DIGEST: ${{ needs.check-lock.outputs.digest }}
            run: |
              gh attestation verify "oci://${IMAGE}@${DIGEST}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-ux-images.yml" \
                --predicate-type https://spdx.dev/Document/v2.3
          - name: Warn when image provenance is absent
            if: needs.check-lock.outputs.attestation == ''
            run: echo "::warning::ux_tools image lock has no recorded build-provenance attestation"
      - id: image
        run: echo "ref=$(uv run python scripts/print_locked_image.py --entry ux_tools)" >> "$GITHUB_OUTPUT"
      - name: Smoke locked image
        env:
          GH_TOKEN: ${{ github.token }}
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/ux/scripts/ux_launcher.py
          out=.launcher-smoke/ux
          mkdir -p "$out"
          if python3 - <<'PY'
          import json
          from pathlib import Path

          entry = json.loads(Path("docker/image-digests.json").read_text(encoding="utf-8"))["ux_tools"]
          raise SystemExit(0 if entry.get("attestation") else 1)
          PY
          then
            export UX_VERIFY_ATTESTATION=require
          else
            export UX_VERIFY_ATTESTATION=auto
          fi
          python3 "$launcher" prewarm
          python3 "$launcher" doctor > "$out/doctor.json"
          set +e
          python3 "$launcher" author examples/smart-kettle/smart-kettle.ux.json \
            --out "$out" > "$out/author.stdout.json"
          status=$?
          set -e
          python3 - "$out" "$status" <<'PY'
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          status = int(sys.argv[2])
          stdout = output / "author.stdout.json"
          reports = sorted(output.rglob("*report.json"))
          printed = False
          for report_path in reports:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              if isinstance(report, dict) and "checks" in report:
                  print(json.dumps(report["checks"], ensure_ascii=False, indent=2))
                  printed = True
          if not printed:
              print(stdout.read_text(encoding="utf-8"))
          result = json.loads(stdout.read_text(encoding="utf-8"))
          if status != 0 or result.get("verdict") != "pass":
              raise SystemExit("ux launcher smoke did not pass")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: locked-image-smoke
          path: ${{ github.workspace }}/.launcher-smoke/ux
          if-no-files-found: ignore
          retention-days: 14
